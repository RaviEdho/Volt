name: Windows CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Check version and build frontend
        run: |
          npm run version:check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
      - name: Run Rust tests
        run: cargo +stable test --locked --manifest-path src-tauri/Cargo.toml
      - name: Test hosts-file updates against a fixture
        shell: powershell
        run: ./src-tauri/tests/sync_hosts.ps1
